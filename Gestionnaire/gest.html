<!DOCTYPE html>
<html lang="en">
<head>
    <title>Gestionnaire</title>
    <link rel="stylesheet" href="gest.css">
</head>
<body>
    <h1>Gestionnaire de dépenses</h1>
    <label for="nom">Nom:</label>

    <h1>Listes depenses</h1>
    <ul id="liste-depense"></ul>
    <p>Total: <span id="total">0</span>Ar</p>

    <script src="gest.js"></script>
</body>
</html>
